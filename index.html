<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاسبه‌گر سن</title>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #eaf0f8;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator {
            background-color: white;
            width: 320px;
            max-width: calc(100% - 60px);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 20px #00000015;
        }

        h1 {
            color: #243b64;
            font-size: 28px;
        }

        p {
            font-size: 17px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            font-size: 18px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 17px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        #result {
            font-size: 18px;
            margin-top: 20px;
            color: #243b64;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h1>محاسبه‌گر سن</h1>

        <p>لطفاً سن خود را وارد کنید:</p>

        <input
            type="number"
            id="age"
            placeholder="سن به سال؛ مثلاً 14"
            min="0"
            step="1"
        >

        <button onclick="checkAge()">بررسی سن</button>

        <h2 id="result"></h2>
    </div>

    <script>
        function checkAge() {
            const ageInput = document.getElementById("age");
            const result = document.getElementById("result");
            const age = ageInput.value.trim();
            const number = Number(age);

            if (age === "") {
                result.innerText = "لطفاً سن خود را وارد کنید!";
            }
            else if (!Number.isInteger(number) || number < 0) {
                result.innerText = "لطفاً سن صحیح و غیرمنفی وارد کنید!";
            }
            else if (number < 1) {
                result.innerText = "شما یک نوزاد هستید.";
            }
            else if (number < 6) {
                result.innerText = "شما یک کودک هستید.";
            }
            else if (number < 12) {
                result.innerText = "شما یک نونهال هستید.";
            }
            else if (number < 18) {
                result.innerText = "شما یک نوجوان هستید.";
            }
            else if (number < 30) {
                result.innerText = "شما یک جوان هستید.";
            }
            else if (number < 60) {
                result.innerText = "شما یک میان‌سال هستید.";
            }
            else {
                result.innerText = "شما یک سالمند هستید.";
            }
        }

        document.getElementById("age").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                checkAge();
            }
        });
    </script>

</body>
</html>
